name: Terraform CI

on:
  pull_request:
    branches:
      - homolog
      - main

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static-check:
    name: Terraform static checks
    runs-on: ubuntu-latest
    outputs:
      shared_changed: ${{ steps.changes.outputs.shared_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Detect shared stack changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -Eq '^(environments/shared/|modules/(ecr|api-publisher-identity|platform-contract)/|bootstrap/|scripts/|\.github/workflows/terraform-|\.terraform-version$)'; then
            echo 'shared_changed=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'shared_changed=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_LINUX_AMD64_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          bin_dir="${RUNNER_TEMP}/trivy-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "${TRIVY_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${bin_dir}"
          tar -xzf "${archive}" -C "${bin_dir}" trivy
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Validate Terraform and shell
        run: bash scripts/terraform-check.sh

      - name: Scan Terraform configuration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .

  plan-environment:
    name: Plan environment
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: static-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
      TF_BACKEND_KMS_KEY_ID: ${{ vars.TF_BACKEND_KMS_KEY_ID }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ github.base_ref == 'main' && vars.PRODUCAO_EKS_PUBLIC_ACCESS_CIDRS_JSON || vars.HOMOLOGACAO_EKS_PUBLIC_ACCESS_CIDRS_JSON }}
      TF_VAR_cluster_permissions_boundary_arn: ${{ github.base_ref == 'main' && vars.PRODUCAO_CLUSTER_PERMISSIONS_BOUNDARY_ARN || vars.HOMOLOGACAO_CLUSTER_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_node_permissions_boundary_arn: ${{ github.base_ref == 'main' && vars.PRODUCAO_NODE_PERMISSIONS_BOUNDARY_ARN || vars.HOMOLOGACAO_NODE_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_deployer_permissions_boundary_arn: ${{ github.base_ref == 'main' && vars.PRODUCAO_DEPLOYER_PERMISSIONS_BOUNDARY_ARN || vars.HOMOLOGACAO_DEPLOYER_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.TF_BACKEND_REGION }}
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}

      - name: Create and inspect saved plan
        env:
          STACK: ${{ github.base_ref == 'main' && 'producao' || 'homologacao' }}
        run: |
          set -Eeuo pipefail
          plan_file="${RUNNER_TEMP}/${STACK}.tfplan"
          bash scripts/terraform-plan.sh "${STACK}" "${plan_file}"
          bash scripts/terraform-plan-policy.sh "${STACK}" "${plan_file}"

  plan-shared:
    name: Plan shared
    if: github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && needs.static-check.outputs.shared_changed == 'true'
    needs: static-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
      TF_BACKEND_KMS_KEY_ID: ${{ vars.TF_BACKEND_KMS_KEY_ID }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_publisher_permissions_boundary_arn: ${{ vars.SHARED_PUBLISHER_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.TF_BACKEND_REGION }}
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}

      - name: Create and inspect saved plan
        run: |
          set -Eeuo pipefail
          plan_file="${RUNNER_TEMP}/shared.tfplan"
          bash scripts/terraform-plan.sh shared "${plan_file}"
          bash scripts/terraform-plan-policy.sh shared "${plan_file}"

  gate:
    name: terraform / gate
    if: ${{ always() }}
    needs:
      - static-check
      - plan-environment
      - plan-shared
    runs-on: ubuntu-latest
    steps:
      - name: Verify required Terraform jobs
        env:
          STATIC_RESULT: ${{ needs.static-check.result }}
          ENVIRONMENT_PLAN_RESULT: ${{ needs.plan-environment.result }}
          SHARED_PLAN_RESULT: ${{ needs.plan-shared.result }}
        run: |
          set -Eeuo pipefail
          test "${STATIC_RESULT}" = success
          case "${ENVIRONMENT_PLAN_RESULT}" in success|skipped) ;; *) exit 1 ;; esac
          case "${SHARED_PLAN_RESULT}" in success|skipped) ;; *) exit 1 ;; esac
