name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack a destruir
        required: true
        type: choice
        options:
          - shared
          - homologacao
          - producao
      confirm_stack:
        description: Digite novamente o nome exato do stack
        required: true
        type: string
      confirm_stack_again:
        description: Repita uma segunda vez o nome exato do stack
        required: true
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: Destroy ${{ inputs.stack }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ inputs.stack }}
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
      TF_BACKEND_KMS_KEY_ID: ${{ vars.TF_BACKEND_KMS_KEY_ID }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS_JSON }}
      TF_VAR_cluster_permissions_boundary_arn: ${{ vars.CLUSTER_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_node_permissions_boundary_arn: ${{ vars.NODE_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_deployer_permissions_boundary_arn: ${{ vars.DEPLOYER_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_publisher_permissions_boundary_arn: ${{ vars.PUBLISHER_PERMISSIONS_BOUNDARY_ARN }}
      ALLOW_PRODUCTION_DESTROY: ${{ vars.ALLOW_PRODUCTION_DESTROY }}
    steps:
      - name: Validate duplicated confirmation and branch
        env:
          STACK: ${{ inputs.stack }}
          CONFIRM_STACK: ${{ inputs.confirm_stack }}
          CONFIRM_STACK_AGAIN: ${{ inputs.confirm_stack_again }}
        run: |
          set -Eeuo pipefail
          test "${CONFIRM_STACK}" = "${STACK}"
          test "${CONFIRM_STACK_AGAIN}" = "${STACK}"

          case "${STACK}" in
            homologacao) expected_ref='refs/heads/homolog' ;;
            shared|producao) expected_ref='refs/heads/main' ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REF}" = "${expected_ref}"

          if [[ "${STACK}" == producao ]]; then
            test "${ALLOW_PRODUCTION_DESTROY:-false}" = true
          fi

      - name: Checkout protected branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.stack == 'homologacao' && 'homolog' || 'main' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Configure destroy credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TF_DESTROY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}

      - name: Record recoverable state version
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -Eeuo pipefail
          bash scripts/terraform-init.sh "${STACK}"
          state_key="oficina/infra/${STACK}/terraform.tfstate"
          state_version="$(aws s3api head-object \
            --bucket "${TF_BACKEND_BUCKET}" \
            --key "${state_key}" \
            --query VersionId \
            --output text)"
          test -n "${state_version}"
          test "${state_version}" != None
          echo "State versionado antes do destroy: `${state_version}`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create and apply destroy plan
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -Eeuo pipefail
          plan_file="${RUNNER_TEMP}/${STACK}-destroy.tfplan"
          terraform -chdir="environments/${STACK}" plan \
            -destroy \
            -input=false \
            -lock-timeout=5m \
            -out="${plan_file}"
          printf '%s\n' "${STACK}" > "${plan_file}.stack"
          bash scripts/terraform-apply.sh "${STACK}" "${plan_file}"
          echo "Destroy de ${STACK} concluído pelo fluxo protegido." >> "${GITHUB_STEP_SUMMARY}"
