name: Terraform Drift

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  drift:
    name: Drift ${{ matrix.stack }}
    # A schedule retains the default branch ref even after checkout of homolog.
    # Manual runs use main too, matching the drift-only Environment protections.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: homologacao
            ref: homolog
            environment: drift-homologacao
          - stack: producao
            ref: main
            environment: drift-producao
    concurrency:
      group: terraform-${{ matrix.stack }}
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_REGION: ${{ vars.TF_BACKEND_REGION }}
      TF_BACKEND_KMS_KEY_ID: ${{ vars.TF_BACKEND_KMS_KEY_ID }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_OIDC_PROVIDER_ARN }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS_JSON }}
      TF_VAR_cluster_permissions_boundary_arn: ${{ vars.CLUSTER_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_node_permissions_boundary_arn: ${{ vars.NODE_PERMISSIONS_BOUNDARY_ARN }}
      TF_VAR_deployer_permissions_boundary_arn: ${{ vars.DEPLOYER_PERMISSIONS_BOUNDARY_ARN }}
    steps:
      - name: Checkout protected branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.1

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Validate assumed plan session
        env:
          EXPECTED_ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          set -Eeuo pipefail
          role_name="${EXPECTED_ROLE_ARN##*/}"
          expected_arn="arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/${role_name}/gha-${GITHUB_RUN_ID}"
          actual_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "${actual_arn}" = "${expected_arn}"

      - name: Detect drift without apply
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -Eeuo pipefail
          set +e
          bash scripts/terraform-drift.sh "${STACK}"
          drift_status=$?
          set -e

          case "${drift_status}" in
            0)
              echo "### ${STACK}: sem drift" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            2)
              echo "::warning title=Terraform drift::Drift detectado em ${STACK}. Execute um plan revisado antes de corrigir."
              echo "### ${STACK}: drift detectado" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "### ${STACK}: erro operacional durante a verificação" >> "${GITHUB_STEP_SUMMARY}"
              exit 1
              ;;
          esac
