apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fase2-kubernetes-oficina-mecanica-api
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: fase2-kubernetes-oficina-mecanica-api
    app.kubernetes.io/instance: oficina-mecanica
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fase2-kubernetes-oficina-mecanica-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
