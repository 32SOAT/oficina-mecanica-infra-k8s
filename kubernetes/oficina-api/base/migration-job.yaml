apiVersion: batch/v1
kind: Job
metadata:
  name: fase2-kubernetes-oficina-mecanica-api-migrations
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/name: fase2-kubernetes-oficina-mecanica-api
    app.kubernetes.io/instance: oficina-mecanica
    app.kubernetes.io/part-of: oficina-mecanica
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fase2-kubernetes-oficina-mecanica-api
        app.kubernetes.io/instance: oficina-mecanica
        app.kubernetes.io/part-of: oficina-mecanica
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: oficina-mecanica-api
          imagePullPolicy: IfNotPresent
          command:
            - node
            - node_modules/typeorm/cli.js
            - migration:run
            - -d
            - dist/database/data-source.js
          envFrom:
            - configMapRef:
                name: fase2-kubernetes-oficina-mecanica-api-config
            - secretRef:
                name: fase2-kubernetes-oficina-mecanica-api-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
