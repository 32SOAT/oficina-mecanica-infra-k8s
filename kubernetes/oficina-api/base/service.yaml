apiVersion: v1
kind: Service
metadata:
  name: fase2-kubernetes-oficina-mecanica-api
  labels:
    app.kubernetes.io/name: fase2-kubernetes-oficina-mecanica-api
    app.kubernetes.io/instance: oficina-mecanica
    app.kubernetes.io/part-of: oficina-mecanica
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: fase2-kubernetes-oficina-mecanica-api
    app.kubernetes.io/instance: oficina-mecanica
    app.kubernetes.io/part-of: oficina-mecanica
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
